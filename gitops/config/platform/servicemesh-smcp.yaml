---
# NOTE: Do NOT define a ServiceMeshControlPlane here!
# RHOAI creates its own SMCP (data-science-smcp) in istio-system.
# Only one SMCP is allowed per namespace. If we create one here,
# RHOAI's KServe component will fail with:
#   "only one service mesh may be installed per project/namespace"
#
# We only define the ServiceMeshMemberRoll to add our app namespaces
# to the RHOAI-managed mesh.
---
apiVersion: maistra.io/v1
kind: ServiceMeshMemberRoll
metadata:
  name: default
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  members:
  - ai-demo
  - knative-serving
  - langchain
