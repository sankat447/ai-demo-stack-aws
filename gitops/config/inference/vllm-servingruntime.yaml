---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-runtime
  namespace: ai-demo
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "vLLM Runtime (T4 GPU optimized)"
spec:
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  multiModel: false
  supportedModelFormats:
  - name: pytorch
    version: "1"
    autoSelect: true
  - name: vllm
    version: "1"
    autoSelect: true
  containers:
  - name: kserve-container
    image: quay.io/modh/vllm:rhoai-2.16
    command: ["python", "-m", "vllm.entrypoints.openai.api_server"]
    args:
    - "--port=8080"
    - "--model=/mnt/models"
    - "--served-model-name={{.Name}}"
    - "--dtype=float16"
    - "--max-model-len=2048"
    - "--gpu-memory-utilization=0.90"
    - "--enforce-eager"
    ports:
    - containerPort: 8080
      protocol: TCP
    env:
    - name: HF_HOME
      value: /tmp/hf_home
    - name: TRANSFORMERS_CACHE
      value: /tmp/hf_home
    - name: CUDA_VISIBLE_DEVICES
      value: "0"
    resources:
      requests:
        cpu: "2"
        memory: "14Gi"
        nvidia.com/gpu: "1"
      limits:
        cpu: "4"
        memory: "15Gi"
        nvidia.com/gpu: "1"
    volumeMounts:
    - name: shm
      mountPath: /dev/shm
  volumes:
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 2Gi
