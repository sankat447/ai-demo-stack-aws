---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama-3-1-8b
  namespace: rhoai-demo
  annotations:
    serving.kserve.io/deploymentMode: Serverless
    serving.knative.openshift.io/enablePassthrough: "true"
    sidecar.istio.io/inject: "true"
    sidecar.istio.io/rewriteAppHTTPProbers: "true"
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 1
    scaleTarget: 1
    scaleMetric: concurrency
    model:
      modelFormat:
        name: vllm
      runtime: vllm-runtime
      # Model downloaded from HuggingFace or pre-staged in S3
      # For T4 GPU (16GB VRAM): use 8B parameter models only
      # Supported: llama-3.1-8b, mistral-7b, granite-8b, qwen2.5-7b
      storageUri: s3://rhoai-demo-demo-data-lake/models/llama-3.1-8b
      resources:
        requests:
          cpu: "2"
          memory: "14Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: "15Gi"
          nvidia.com/gpu: "1"
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/gpu
      operator: Exists
      effect: NoSchedule
    nodeSelector:
      nvidia.com/gpu.present: "true"
