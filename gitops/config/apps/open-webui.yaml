---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: rhoai-demo
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
        env:
        - name: WEBUI_SECRET_KEY
          value: "@Demo123#"
        - name: OPENAI_API_BASE_URL
          value: "http://portkey.rhoai-demo.svc:8787/v1"
        - name: OPENAI_API_KEY
          value: "demo-key"
        - name: MONGODB_URI
          value: "mongodb://root:@Demo123#@mongodb.rhoai-demo.svc:27017"
        - name: DEFAULT_MODELS
          value: "llama-3.1-8b"
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: open-webui-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: rhoai-demo
spec:
  accessModes: [ReadWriteMany]
  storageClassName: efs-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: rhoai-demo
spec:
  selector:
    app: open-webui
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: open-webui
  namespace: rhoai-demo
spec:
  to:
    kind: Service
    name: open-webui
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
