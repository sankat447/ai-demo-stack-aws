---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rhoai-demo
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: docker.io/bitnami/redis:7.2
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          value: "@Demo123#"
        volumeMounts:
        - name: data
          mountPath: /bitnami/redis/data
        readinessProbe:
          exec:
            command: ["redis-cli", "-a", "@Demo123#", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: rhoai-demo
spec:
  accessModes: [ReadWriteMany]
  storageClassName: efs-sc
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rhoai-demo
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
