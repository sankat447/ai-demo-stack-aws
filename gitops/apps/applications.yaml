# =============================================================================
#  ArgoCD App-of-Apps — AI Demo Stack
#  8 sync waves orchestrating ~23 applications
# =============================================================================

# ── WAVE 1: Namespaces + Operator Subscriptions ────────────────────────────
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/sankat447/ai-demo-stack-aws
    targetRevision: main
    path: gitops/namespaces
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: efs-csi-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/sankat447/ai-demo-stack-aws
    targetRevision: main
    path: gitops/config/platform
    directory:
      include: "efs-csi-*.yaml"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
